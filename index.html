<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cozy Cat 🐱</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cozy-wrapper">
        <!-- Кот — центральный элемент, на который нужно нажимать -->
        <div id="cat-container" class="cat-standard">
            <img src="assets/cat.png" alt="Cozy Cat" id="cat-img">
        </div>

        <!-- Область для текста сообщений -->
        <div id="message-area">
            <p id="message-text">Мяу! Нажми на меня 🐾</p>
        </div>
    </div>

    <!-- Подключаем логику -->
    <script src="script.js"></script>
</body>
</html>

  <h1>🐱 Тест отправки фото (Камера / Галерея)</h1>

  <div class="file-select">
    <!-- Отсутствие capture="camera" даёт нативное меню выбора: Камера или Галерея -->
    <input type="file" id="photo" accept="image/*">
  </div>

  <div id="preview-container">
    <img id="preview" alt="Предпросмотр">
  </div>

  <button id="send" disabled>📸 Отправить фото</button>

  <p id="status">Выберите фото или сделайте снимок</p>

  <script>
    const photoInput = document.getElementById("photo");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    let currentFile = null;

    // Вспомогательная функция: нормализация фото через Canvas
    async function normalizeImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement("canvas");
                // Устанавливаем размеры (можно ограничить максимум, например 1200px)
                const maxDimension = 1200;
                let width = img.width;
                let height = img.height;

                if (width > maxDimension || height > maxDimension) {
                    if (width > height) {
                        height *= maxDimension / width;
                        width = maxDimension;
                    } else {
                        width *= maxDimension / height;
                        height = maxDimension;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                // Превращаем в чистый JPEG
                canvas.toBlob((blob) => {
                    resolve(new File([blob], "normalized_photo.jpg", { type: "image/jpeg" }));
                }, "image/jpeg", 0.85); // 0.85 качество
            };
            img.src = URL.createObjectURL(file);
        });
    }

    photoInput.addEventListener("change", (e) => {
        const files = e.target.files;
        if (files && files[0]) {
            currentFile = files[0];
            preview.src = URL.createObjectURL(currentFile);
            preview.style.display = "block";
            sendButton.disabled = false;
            status.textContent = "Фото выбрано, готово к отправке.";
        }
    });

    sendButton.addEventListener("click", async () => {
        if (!currentFile) return;

        status.textContent = "⚙️ Обработка фото...";
        sendButton.disabled = true;

        try {
            // Нормализуем фото перед отправкой (это исправит баг с фронтальной камерой)
            const cleanFile = await normalizeImage(currentFile);
            
            status.textContent = "⏳ Отправка...";
            
            const formData = new FormData();
            formData.append("photo", cleanFile);

            const response = await fetch("https://broken-wave-1cb1.azizyashnarov.workers.dev/send-photo", {
                method: "POST",
                body: formData
            });

            const result = await response.json();

            if (response.ok && result.success) {
                status.textContent = "✅ Фотография успешно доставлена!";
                preview.style.display = "none";
                photoInput.value = "";
                currentFile = null;
            } else {
                throw new Error("Ошибка сервера");
            }
        } catch (error) {
            console.error(error);
            status.textContent = "❌ Ошибка при отправке. Попробуй еще раз.";
            sendButton.disabled = false;
        }
    });
</script>
</body>
</html>
