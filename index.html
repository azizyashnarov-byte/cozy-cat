<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cozy Cat 🐱</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="music-btn" aria-label="Включить музыку">🎵</button>

  <div class="cozy-card">
    
    <div id="cat-container">
      <img src="assets/cat.svg" alt="Cozy Cat" id="cat-img">
      <!-- Иконка кольца, скрытая до финала -->
      <div id="ring-element">💍</div>
    </div>

    <p id="message-text">Мяу! Нажми на меня 🐾</p>

    <div id="photo-box">
      <label for="photo-input" class="file-input-label">📸 Выбрать или сделать фото</label>
      <input type="file" id="photo-input" accept="image/*">
      
      <img id="preview" alt="Предпросмотр">
      
      <button id="send-btn" disabled>Отправить фото ❤️</button>
      <p id="status">Сделай фото для выполнения задания</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
