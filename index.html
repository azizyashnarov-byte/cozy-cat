<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozy Cat — Test</title>
</head>

<body>
  <h2>🐱 Тест отправки фото</h2>

  <input
  type="file"
  id="photo"
  accept="image/*"
  capture="environment"
>

  <br><br>

  <button id="send">Отправить фото</button>

  <p id="status"></p>

  <script>
const photoInput = document.getElementById("photo");
const sendButton = document.getElementById("send");
const status = document.getElementById("status");

photoInput.addEventListener("change", () => {
  if (photoInput.files && photoInput.files.length > 0) {
    const photo = photoInput.files[0];

    status.textContent =
      `Фото готово: ${photo.name || "фото"} (${Math.round(photo.size / 1024)} KB)`;
  }
});

sendButton.addEventListener("click", async () => {
  if (!photoInput.files || photoInput.files.length === 0) {
    status.textContent = "Сначала сделай или выбери фото.";
    return;
  }

  const photo = photoInput.files[0];

  status.textContent = "Отправляю...";

  const formData = new FormData();
  formData.append("photo", photo, photo.name || "camera-photo.jpg");

  try {
    const response = await fetch(
      "https://broken-wave-1cb1.azizyashnarov.workers.dev/send-photo",
      {
        method: "POST",
        body: formData
      }
    );

    const result = await response.json();

    if (result.success) {
      status.textContent = "✅ Фото отправлено!";
    } else {
      status.textContent = "❌ Telegram не принял фото.";
      console.log(result);
    }
  } catch (error) {
    status.textContent = "❌ Ошибка соединения.";
    console.error(error);
  }
});
  </script>
</body>
</html>
